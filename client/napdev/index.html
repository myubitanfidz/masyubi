<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napdev</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <!-- Placeholder Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- ===== HERO ===== -->
  <section class="hero" id="home">

    <!-- Video Background -->
    <div class="hero-video" aria-hidden="true">
      <video
        class="hero-video-bg"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
        <source src="videos/beranda.mp4" type="video/mp4" />
        Browser kamu tidak mendukung tag video.
      </video>
    </div>

    <!-- Overlay Gelap -->
    <div class="hero-overlay"></div>

    <!-- Konten Hero (kosong, biar video terlihat) -->
    <div class="container hero-content"></div>

  </section>

  <!-- ===== OUR PROJECT — FLAT CAROUSEL ===== -->
  <section class="projects" id="projects">

    <div class="container">
      <div class="projects-header">
        <span class="projects-tag">Built by passion</span>
        <h2 class="projects-title">Projects we're proud of.</h2>
      </div>
    </div>

    <div class="carousel-wrapper" id="carousel">
      <div class="carousel-track" id="track">
        <!-- Kartu di-generate oleh JavaScript -->
      </div>
    </div>

  </section>

  <!-- Placeholder Footer -->
  <div id="footer-placeholder"></div>

  <!-- Script untuk navbar, footer, dan carousel -->
  <script>
    // Fetch navbar
    fetch('component/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    // Fetch footer
    fetch('component/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });

    // ===== Generate carousel =====
    (function () {
      const track = document.getElementById('track');
      if (!track) return;

      // PETUNJUK EDIT KARTU:
      // src   = lokasi gambar, title = nama game, desc = deskripsi singkat.
      // url   = tautan lengkap halaman game (Steam, itch.io, atau situs game).
      // Contoh: url: 'https://nama-studio.itch.io/nama-game'
      // Ganti nilai url di setiap project dengan tautan gamenya, di dalam tanda petik.
      // Kosongkan url jika belum tersedia; kartu tersebut belum bisa diklik.
      // Cukup edit empat project ini. Kartu berulang mengikuti data secara otomatis.
      const projects = [
        {
          src: 'img/game-2.png',
          title: 'Super Muslim',
          desc: 'Game aksi yang bisa dimainkan langsung di browser.',
          url: 'https://napdev.itch.io/supermoslem' // Ganti tautan Super Muslim di sini.
        },
        {
          src: 'https://img.itch.zone/aW1nLzI4MTI4MzYwLmdpZg==/315x250%23c/bsXNZc.gif',
          title: 'Slimy Spin Spear',
          desc: 'Slime oranye dengan tombak ungu yang berputar.',
          url: 'https://napdev.itch.io/slimespear' // Ganti tautan Slimy Spin Spear di sini.
        },
        {
          src: 'https://img.itch.zone/aW1nLzI3Mzk2MTIzLmdpZg==/315x250%23c/mx%2FX8V.gif',
          title: 'Project : OUTFRAME',
          desc: 'Game aksi Napdev yang bisa dimainkan di browser.',
          url: 'https://napdev.itch.io/project-outframe' // Ganti tautan project ketiga di sini.
        },
        {
          src: 'https://img.itch.zone/aW1nLzIxNDI1MzQxLnBuZw==/315x250%23c/6elDDF.png',
          title: 'Sepertiga Malam',
          desc: 'Petualangan membawa cahaya di tengah hutan gelap dan lebat.',
          url: 'https://napdev.itch.io/sepertiga-malam' // Ganti tautan project keempat di sini.
        }
      ];

      // 12 slide total (loop mulus) — kelipatan dari jumlah project
      const TOTAL_SLIDES = 12;

      for (let i = 0; i < TOTAL_SLIDES; i++) {
        const item = projects[i % projects.length];

        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        slide.innerHTML = `
          <a class="carousel-card" draggable="false">
            <img src="${item.src}" alt="${item.title}" loading="lazy" draggable="false" />
            <div class="carousel-card-overlay">
              <h3 class="carousel-card-title">${item.title}</h3>
              <p class="carousel-card-desc">${item.desc}</p>
              ${item.url ? '<span class="carousel-card-link">Lihat game ↗</span>' : ''}
            </div>
          </a>
        `;

        const card = slide.firstElementChild;
        if (item.url.trim()) {
          card.href = item.url.trim();
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.setAttribute('aria-label', `Lihat game ${item.title} (tab baru)`);
        }

        track.appendChild(slide);
      }
    })();

    // ===== Animasi carousel =====
    (function () {
      const wrapper = document.getElementById('carousel');
      const track = document.getElementById('track');
      if (!wrapper || !track) return;

      const SPEED = 46.2; // Pixel per detik, 40% lebih cepat dari 33.
      const CARD_SCALE = 0.765; // 15% lebih kecil dari ukuran sebelumnya (0.9 × 0.85).
      const HIGHLIGHT_SCALE = 1.15;
      const SCALE_TRANSITION_SPAN = 0.2; // Transisi ukuran memakai 20% jarak antar kartu.
      const CENTER_SHIFT_RATIO = -0.06; // Koreksi visual ke kiri: 6% jarak antar kartu.
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let wrapperWidth = 0;
      let cardWidth = 0;
      let step = 0;
      let centerShift = 0;
      let offset = 0;
      let lastTime = null;

      function render() {
        track.style.transform = `translateX(${-offset + centerShift}px)`;
        const highlightCenter = wrapperWidth / 2 + centerShift;

        Array.from(track.children).forEach((slide, i) => {
          const center = i * step - offset + centerShift + cardWidth / 2;
          const distance = Math.abs(center - highlightCenter);

          // Transisi singkat di batas kartu tepi dan dua kartu tengah.
          // Smoothstep menjaga awal dan akhir perubahan ukuran tetap halus.
          const transitionStart = step * (1 - SCALE_TRANSITION_SPAN / 2);
          const transitionWidth = step * SCALE_TRANSITION_SPAN;
          const t = Math.max(0, Math.min(1, (distance - transitionStart) / transitionWidth));
          const eased = t * t * (3 - 2 * t);
          const highlight = 1 - eased;
          const card = slide.firstElementChild;
          card.style.transform = `scale(${CARD_SCALE * (1 + (HIGHLIGHT_SCALE - 1) * highlight)})`;
          card.style.opacity = 0.65 + 0.35 * highlight;
          slide.style.zIndex = Math.round(highlight * 10);
        });
      }

      function resize() {
        const styles = getComputedStyle(wrapper);
        const gap = parseFloat(getComputedStyle(track).columnGap);
        const visibleCards = parseFloat(styles.getPropertyValue('--visible-cards'));
        const oldStep = step;
        wrapperWidth = wrapper.clientWidth;
        step = wrapperWidth / visibleCards;
        centerShift = step * CENTER_SHIFT_RATIO;
        cardWidth = step - gap;
        track.style.setProperty('--card-width', `${cardWidth}px`);
        offset = oldStep ? offset / oldStep * step : -gap / 2;
        render();
      }

      new ResizeObserver(resize).observe(wrapper);
      resize();

      function animate(time) {
        const elapsed = lastTime === null ? 0 : Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;

        // Area kosong dan celah tidak menghentikan carousel.
        const hoveredCard = track.querySelector('.carousel-card:hover');
        const focusedCard = track.contains(document.activeElement);
        if (!hoveredCard && !focusedCard && !reducedMotion.matches && !document.hidden) {
          offset += SPEED * elapsed;

          // Pindahkan kartu hanya setelah seluruh kartu keluar dari layar.
          while (step > 0 && offset > cardWidth + 20) {
            track.appendChild(track.firstElementChild);
            offset -= step;
          }

          render();
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>

</body>
</html>
