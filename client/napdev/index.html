<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napdev</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <!-- Placeholder Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- ===== HERO ===== -->
  <section class="hero" id="home">

    <!-- Video Background -->
    <div class="hero-video" aria-hidden="true">
      <video
        class="hero-video-bg"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
        <source src="videos/beranda.mp4" type="video/mp4" />
        Browser kamu tidak mendukung tag video.
      </video>
    </div>

    <!-- Overlay Gelap -->
    <div class="hero-overlay"></div>

    <!-- Konten Hero (kosong, biar video terlihat) -->
    <div class="container hero-content"></div>

  </section>

  <!-- ===== OUR PROJECT — 3D TUBE CAROUSEL ===== -->
  <section class="projects" id="projects">

    <div class="container">
      <div class="projects-header">
        <span class="projects-tag">Built by passion</span>
        <h2 class="projects-title">Projects we're proud of.</h2>
      </div>
    </div>

    <div class="tube-wrapper" id="tube-wrapper">
      <div class="tube" id="tube">
        <!-- Kartu di-generate oleh JavaScript -->
      </div>
    </div>

  </section>

  <!-- ===== Project We Guide ===== -->
  <section class="guide" id="guide">
    <div class="container">
      <div class="guide-header">
        <h2 class="guide-title">Project we help to create</h2>
      </div>

      <p class="guide-desc">
        Napdev juga menyediakan layanan konsultasi dan bimbingan untuk pengembangan game. Kami siap membantu kamu untuk mewujudkan ide gamemu menjadi kenyataan.
      </p>

      <!-- 3 gambar dalam 1 baris — hover untuk memunculkan judul -->
      <!-- EDIT: ganti src, judul, dan href di bawah ini -->
      <div class="guide-grid">

        <a class="guide-card"
           href="https://napdev.itch.io/slimespear"
           target="_blank" rel="noopener noreferrer"
           aria-label="Lihat game Slimy Spin Spear (tab baru)">
          <img src="https://img.itch.zone/aW1nLzI4MTI4MzYwLmdpZg==/315x250%23c/bsXNZc.gif"
               alt="Slimy Spin Spear" loading="lazy" draggable="false" />
          <div class="guide-card-overlay">
            <h3 class="guide-card-title">Slimy Spin Spear</h3>
          </div>
        </a>

        <a class="guide-card"
           href="https://napdev.itch.io/project-outframe"
           target="_blank" rel="noopener noreferrer"
           aria-label="Lihat game Project : OUTFRAME (tab baru)">
          <img src="https://img.itch.zone/aW1nLzI3Mzk2MTIzLmdpZg==/315x250%23c/mx%2FX8V.gif"
               alt="Project : OUTFRAME" loading="lazy" draggable="false" />
          <div class="guide-card-overlay">
            <h3 class="guide-card-title">Project : OUTFRAME</h3>
          </div>
        </a>

        <a class="guide-card"
           href="https://napdev.itch.io/sepertiga-malam"
           target="_blank" rel="noopener noreferrer"
           aria-label="Lihat game Sepertiga Malam (tab baru)">
          <img src="https://img.itch.zone/aW1nLzIxNDI1MzQxLnBuZw==/315x250%23c/6elDDF.png"
               alt="Sepertiga Malam" loading="lazy" draggable="false" />
          <div class="guide-card-overlay">
            <h3 class="guide-card-title">Sepertiga Malam</h3>
          </div>
        </a>

      </div>
      <!-- /guide-grid -->

      <a class="guide-see-more" href="guide-project/">see more</a>
    </div>
  </section>

  <!-- Placeholder Footer -->
  <div id="footer-placeholder"></div>

  <!-- Script untuk navbar, footer, dan tube carousel -->
  <script>
    // Fetch navbar
    fetch('component/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    // Fetch footer
    fetch('component/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });

    // ===== Generate tube cards =====
    (function () {
      const tube = document.getElementById('tube');
      if (!tube) return;

      const TOTAL_CARDS = 16;

      // Data project — tambah/hapus sesuai kebutuhan
      const images = [
        {
          src: 'img/game-2.png',
          title: 'Super muslim',
          desc: 'Game ali jihad'
        },
        {
          src: 'img/game-1.png',
          title: 'Slime lompat',
          desc: 'slime kayak rimuru'
        },
        {
          src: 'img/project-3.jpg',
          title: 'Project Gamma',
          desc: 'Platform e-commerce modern dengan integrasi multi-payment gateway.'
        },
        {
          src: 'img/project-4.jpg',
          title: 'Project Delta',
          desc: 'Website company profile interaktif dengan animasi scroll modern.'
        }
      ];

      for (let i = 0; i < TOTAL_CARDS; i++) {
        const item = images[i % images.length];
        const card = document.createElement('div');
        card.className = 'tube-card';
        card.style.setProperty('--i', i);

        card.innerHTML = `
          <img src="${item.src}" alt="${item.title}" loading="lazy" draggable="false" />
          <div class="tube-card-overlay">
            <h3 class="tube-card-title">${item.title}</h3>
            <p class="tube-card-desc">${item.desc}</p>
          </div>
        `;

        tube.appendChild(card);
      }
    })();

    // ===== Drag + auto-rotate tabung + pause saat hover card =====
    (function () {
      const wrapper = document.getElementById('tube-wrapper');
      const tube = document.getElementById('tube');
      if (!wrapper || !tube) return;

      let rotation = 0;
      let velocity = 0;
      const AUTO_SPEED = 0.04;
      const FRICTION = 0.94;
      const DRAG_SENSITIVITY = 0.35;

      let isDragging = false;
      let isHoveringCard = false; // pause hanya saat hover card
      let lastX = 0;

      // Deteksi hover spesifik ke .tube-card
      tube.addEventListener('pointerover', (e) => {
        if (e.target.closest('.tube-card')) {
          isHoveringCard = true;
        }
      });

      tube.addEventListener('pointerout', (e) => {
        const fromCard = e.target.closest('.tube-card');
        const toCard = e.relatedTarget && e.relatedTarget.closest
          ? e.relatedTarget.closest('.tube-card')
          : null;

        if (fromCard && !toCard) {
          isHoveringCard = false;
        }
      });

      // Cadangan untuk browser lama / kalau pointerover tidak jalan
      tube.addEventListener('mouseover', (e) => {
        if (e.target.closest('.tube-card')) isHoveringCard = true;
      });
      tube.addEventListener('mouseout', (e) => {
        const fromCard = e.target.closest('.tube-card');
        const toCard = e.relatedTarget && e.relatedTarget.closest
          ? e.relatedTarget.closest('.tube-card')
          : null;
        if (fromCard && !toCard) isHoveringCard = false;
      });

      function animate() {
        if (!isDragging && !isHoveringCard) {
          if (Math.abs(velocity) < AUTO_SPEED) {
            velocity = AUTO_SPEED;
          }
          velocity *= FRICTION;
          if (Math.abs(velocity) < AUTO_SPEED) {
            velocity = AUTO_SPEED;
          }
          rotation += velocity;
        }

        tube.style.setProperty('--rot', rotation + 'deg');
        requestAnimationFrame(animate);
      }
      animate();

      wrapper.addEventListener('pointerdown', (e) => {
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
        wrapper.classList.add('dragging');
        wrapper.setPointerCapture(e.pointerId);
      });

      wrapper.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        const dx = e.clientX - lastX;
        lastX = e.clientX;

        rotation += dx * DRAG_SENSITIVITY;
        velocity = dx * DRAG_SENSITIVITY;

        tube.style.setProperty('--rot', rotation + 'deg');
      });

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        wrapper.classList.remove('dragging');
      }

      wrapper.addEventListener('pointerup', endDrag);
      wrapper.addEventListener('pointercancel', endDrag);
      wrapper.addEventListener('pointerleave', endDrag);
      wrapper.addEventListener('dragstart', (e) => e.preventDefault());
    })();
  </script>

</body>
</html>
