<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napdev</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Placeholder Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- ===== HERO ===== -->
<section class="hero" id="home">

  <!-- Video Background -->
  <div class="hero-video" aria-hidden="true">
    <video
      class="hero-video-bg"
      autoplay
      muted
      loop
      playsinline
      preload="auto">
      <source src="videos/beranda.mp4" type="video/mp4" />
      Browser kamu tidak mendukung tag video.
    </video>
  </div>

  <!-- Overlay Gelap -->
  <div class="hero-overlay"></div>

  <!-- Konten Hero -->
  <div class="container hero-content">
    <p class="hero-tagline">GAME DEVELOPMENT • DIGITAL EXPERIENCE</p>
    <h1>Crafting <span>Exceptional</span><br>Digital Products</h1>
    <p class="hero-desc">Kami membantu bisnis Anda tumbuh dengan layanan profesional, inovatif, dan terpercaya sejak 2015.</p>
    <div class="hero-buttons">
      <a href="#contact" class="btn btn-primary">Hubungi Kami</a>
    </div>
  </div>

</section>

  

  

  <!-- Placeholder Footer -->
  <div id="footer-placeholder"></div>

  <!-- Script untuk navbar dan footer -->
  <script>
    // Load Navbar
    fetch('component/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    // Load Footer
    fetch('component/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>

</body>
</html>
